name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test runner
        run: python -m pip install pytest

      - name: Run the stack validator against this repository
        run: python3 scripts/validate_stack.py --repo .

      - name: Run the validator test suite
        run: python -m pytest test/ -q
